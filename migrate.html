document.getElementById("btn-run").onclick=async()=>{
  document.getElementById("btn-run").disabled=true;
  log("เริ่ม migrate...","info");
  let ok=0,fail=0;
  for(const[key,set]of Object.entries(QUIZ_SETS)){
    try{
      await setDoc(doc(db,"quizSets",key),set);
      log(`  ✓ ${key} (${set.name}) — ${set.qs.length} ข้อ`,"ok");
      ok++;
    }catch(e){
      log(`  ✗ ${key} — ${e.message}`,"err");
      fail++;
    }
  }
  log(`เสร็จ: สำเร็จ ${ok} / ผิดพลาด ${fail}`,fail?"err":"ok");
  document.getElementById("btn-run").disabled=false;
};

document.getElementById("btn-verify").onclick=async()=>{
  log("กำลังอ่านจาก Firestore...","info");
  try{
    const snap=await getDocs(collection(db,"quizSets"));
    if(snap.empty){log("ไม่มี doc ใน quizSets","err");return;}
    snap.forEach(d=>{
      const x=d.data();
      log(`  • ${d.id}: ${x.name} (${x.qs?.length||0} ข้อ, active=${x.active}, order=${x.order})`,"ok");
    });
  }catch(e){log("✗ "+e.message,"err");}
};
</script>
